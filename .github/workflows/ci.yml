
name: QrCodeGenerator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Normalize GitHub username
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: ./QrCodeGenerator.Api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/qrcodegenerator-api:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/qrcodegenerator-api:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Angular
        uses: docker/build-push-action@v7
        with:
          context: ./qrcode-generator-web
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/qrcodegenerator-web:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/qrcodegenerator-web:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
